[package]
name = "cce-relief"
version = "0.1.0"
edition = "2021"
description = "The DE's relief editors: cce-relief (the wall and edge profiles, finish and frost) and cce-ramp (a ramp spec)"

[dependencies]
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "6807661a3599cdce36720cb5f6c0a0ee8576c0f3" }
kdl = "4.6"
serde_json = "1.0"

[lints.clippy]
# cce-ui's house style, which these editors were written under while they were its bins:
# geometry and colour taken piecewise, knob triples as tuples, spec constants as given.
too_many_arguments = "allow"
type_complexity = "allow"
excessive_precision = "allow"
needless_range_loop = "allow"
